name: Deploy Hugo site to Pages

on:
  push:
    branches: [github]
  workflow_dispatch:

permissions:
  contents: read
  deployments: write
  id-token: write
  pages: write

concurrency:
  group: pages
  cancel-in-progress: false

defaults:
  run:
    shell: bash

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      HUGO_VERSION: 0.169.0
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: recursive
          fetch-depth: 0

      - name: Install Hugo CLI
        run: |
          hugo_release_url=$(curl -s https://api.github.com/repos/gohugoio/hugo/releases/tags/v${HUGO_VERSION} | jq -r '.assets[] | select(.name=="hugo_extended_'${HUGO_VERSION}'_linux-amd64.tar.gz").browser_download_url' | head -n1)
          curl -sSL "$hugo_release_url" -o hugo.tar.gz
          tar -xzf hugo.tar.gz hugo
          mkdir -p "$HOME/.local/bin"
          mv hugo "$HOME/.local/bin/hugo"

      - name: Build with Hugo
        run: hugo --gc --minify

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./public

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
